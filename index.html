<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#050505" />
<title>19.1.13.19.15.14</title>
<style>
:root{--bg:#050505;--fg:#f4f4ef;--muted:#757575;--line:#222;--bad:#ff5148;--ok:#d8ff5c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}body{overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:20;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.018) 0,rgba(255,255,255,.018) 1px,transparent 1px,transparent 4px);opacity:.35}
.noise{position:fixed;inset:-40px;pointer-events:none;opacity:.05;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");animation:n 1.2s steps(2) infinite}@keyframes n{25%{transform:translate(-2%,1%)}50%{transform:translate(1%,-1%)}75%{transform:translate(2%,2%)}}
.shell{min-height:100svh;display:flex;flex-direction:column;position:relative;z-index:1}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;color:#777;font-size:11px;letter-spacing:.12em;text-transform:uppercase}.status{display:flex;gap:9px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:#ff3b30;box-shadow:0 0 16px #ff3b30;animation:p 1.8s infinite}@keyframes p{50%{opacity:.25}}
main{width:min(920px,100%);margin:auto;padding:32px 18px 70px}.card{border:1px solid var(--line);background:linear-gradient(180deg,#0b0b0b,#080808);padding:clamp(24px,5vw,58px);position:relative;overflow:hidden;box-shadow:0 0 28px rgba(255,255,255,.035)}.card:after{content:"";position:absolute;left:0;top:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,#fff,transparent);opacity:.08}.kicker{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#707070;margin-bottom:24px}h1{font-size:clamp(32px,8vw,82px);line-height:.92;letter-spacing:-.06em;margin:0 0 24px;text-transform:uppercase}.copy{max-width:680px;font-size:clamp(14px,2vw,17px);line-height:1.65;color:#b6b6b6}.bigcode{font-size:clamp(27px,8vw,66px);letter-spacing:.14em;margin:40px 0 26px}.form{display:flex;gap:10px;margin-top:26px;max-width:650px}input{flex:1;min-width:0;background:#050505;border:1px solid #2a2a2a;color:#fff;padding:16px 15px;font:inherit;outline:none}input:focus{border-color:#555}button{background:#f4f4ef;color:#050505;border:0;padding:15px 17px;font:700 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.feedback{height:24px;margin-top:12px;font-size:12px;color:#777}.feedback.bad{color:var(--bad)}.feedback.good{color:var(--ok)}.meta{margin-top:38px;padding-top:18px;border-top:1px solid #191919;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;color:#505050;font-size:10px;text-transform:uppercase;letter-spacing:.13em}.glitch.hit{animation:g .35s steps(2)}@keyframes g{20%{transform:translate(-3px,1px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-2px,2px)}80%{transform:translate(2px,-1px)}}
.lines{margin:32px 0 8px;display:grid;gap:12px}.lines div{border-left:1px solid #2b2b2b;padding:8px 12px;color:#9b9b9b}.lines b{color:#fff}.prize{margin:34px 0 20px;border:1px solid #333;padding:28px;background:#090909}.prize .num{color:#666;font-size:11px;letter-spacing:.2em}.prize .open{font-size:clamp(40px,10vw,86px);font-weight:800;letter-spacing:-.05em;margin-top:10px}.specgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:#202020;margin:34px 0}.spec{background:#090909;padding:22px}.spec small{color:#666;display:block;text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}.spec strong{font-size:24px}.finalLogo{font-size:clamp(28px,8vw,68px);font-weight:800;letter-spacing:-.055em;line-height:.95;margin:20px 0}.finalSub{font-size:15px;color:#999}.hidden{display:none!important}.confetti{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden}.confetti i{position:absolute;top:-15px;width:8px;height:18px;background:#fff;animation:fall linear forwards}@keyframes fall{to{transform:translate3d(var(--drift),110svh,0) rotate(720deg);opacity:.12}}
@media(max-width:620px){.form{flex-direction:column}.form button{width:100%}.specgrid{grid-template-columns:1fr}.top{padding:14px}.card{padding:28px 20px}.bigcode{white-space:normal}}
</style>
</head>
<body>
<div class="noise"></div><div class="shell"><div class="top"><div>PROTOCOL / 180</div><div class="status"><span class="dot"></span><span id="status">LOCKED</span></div></div><main><section class="card glitch" id="card"></section></main></div><div class="confetti" id="confetti"></div>
<script>
(()=>{const $=s=>document.querySelector(s),card=$("#card"),status=$("#status"),K="samson_protocol_stage";const norm=s=>(s||"").trim().toUpperCase().replace(/Ё/g,"Е").replace(/[^A-ZА-Я0-9]/g,"");if(new URLSearchParams(location.search).get("reset")==="1")localStorage.removeItem(K);let stage=Math.max(0,Math.min(4,Number(localStorage.getItem(K)||0))),tries=0;
const beep=(f=520,d=.05)=>{try{let A=window.AudioContext||window.webkitAudioContext,a=new A(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.type="square";g.gain.value=.025;o.connect(g);g.connect(a.destination);o.start();setTimeout(()=>{o.stop();a.close()},d*1000)}catch(e){}};
const hit=()=>{card.classList.remove("hit");void card.offsetWidth;card.classList.add("hit");beep(140,.07)};const setStage=n=>{stage=n;tries=0;localStorage.setItem(K,String(n));render()};const feed=(t,ok=false)=>{let f=$("#feedback");if(f){f.textContent=t;f.className="feedback "+(ok?"good":"bad")}};const bind=(answers,next,ok="ACCESS GRANTED")=>{let i=$("#answer"),b=$("#submit");let go=()=>{tries++;if(answers.map(norm).includes(norm(i.value))){feed(ok,true);status.textContent="UNLOCKED";beep(820,.06);setTimeout(()=>setStage(next),650)}else{feed(tries>=3?"НЕВЕРНЫЙ КЛЮЧ // СМОТРИ ВНИМАТЕЛЬНЕЕ":"НЕВЕРНЫЙ КЛЮЧ");hit();i.select()}};b.onclick=go;i.onkeydown=e=>{if(e.key==="Enter")go()};setTimeout(()=>i.focus(),100)};
const wrap=(k,t,b,x="")=>`<div class="kicker">${k}</div><h1>${t}</h1><div class="copy">${b}</div>${x}<div class="meta"><span>SESSION ${String(stage+1).padStart(2,"0")}</span><span>NO EXTERNAL HELP REQUIRED</span></div>`;
function render(){status.textContent=stage===4?"COMPLETE":"LOCKED";
if(stage===0){document.title="19.1.13.19.15.14";card.innerHTML=wrap("IDENTITY CHECK / 01","Ты уже внутри.",`Подсказок не будет. Они здесь и не нужны.<br><br>У системы есть один вопрос: <b>кто должен пройти дальше?</b>`,`<div class="bigcode">19 · 1 · 13 · 19 · 15 · 14</div><div class="form"><input id="answer" autocomplete="off" autocapitalize="characters" placeholder="KEY"><button id="submit">ENTER</button></div><div class="feedback" id="feedback"></div>`);bind(["SAMSON","САМСОН"],1,"IDENTITY CONFIRMED")}
if(stage===1){document.title="READ // BEGINNING";card.innerHTML=wrap("OBSERVATION TEST / 02","Начало важнее конца.",`Шесть строк. Один ключ. Ты уже видел правило.`,`<div class="lines"><div><b>К</b>аждый предмет когда-нибудь был сырьём.</div><div><b>У</b> любого кода есть порядок чтения.</div><div><b>Р</b>ешение почти всегда ближе, чем кажется.</div><div><b>И</b>щи не смысл предложения, а структуру.</div><div><b>Ц</b>енность скрывается в деталях.</div><div><b>А</b> теперь назови источник.</div></div><div class="form"><input id="answer" autocomplete="off" placeholder="KEY"><button id="submit">ENTER</button></div><div class="feedback" id="feedback"></div>`);bind(["КУРИЦА","CHICKEN"],2,"REWARD 01 UNLOCKED")}
if(stage===2){document.title="REWARD // 01";card.innerHTML=wrap("REWARD UNLOCKED","Открой 01.",`Не переходи дальше, пока коробка <b>01</b> не открыта.`,`<div class="prize"><div class="num">PACKAGE</div><div class="open">01</div></div><button id="continue">01 ОТКРЫТА</button>`);$("#continue").onclick=()=>setStage(3)}
if(stage===3){document.title="MATERIAL // KEY";card.innerHTML=wrap("MATERIAL CHECK / 03","Это ещё не конец.",`Первый приз был биологическим. Второй — синтетический.<br><br>Следующий ключ перед тобой. <b>A = 1.</b>`,`<div class="bigcode">16 · 12 · 1</div><div class="form"><input id="answer" autocomplete="off" autocapitalize="characters" placeholder="KEY"><button id="submit">ENTER</button></div><div class="feedback" id="feedback"></div>`);bind(["PLA","ПЛА"],4,"FINAL SEQUENCE ARMED")}
if(stage===4){document.title="SAMSON INDUSTRIES // ONLINE";status.textContent="COMPLETE";card.innerHTML=wrap("FINAL / PRODUCTION","Открой 02.",`Там находится сырьё. После того как увидишь его, нажми кнопку ниже.`,`<div class="prize"><div class="num">PACKAGE</div><div class="open">02</div></div><button id="reveal">СЫРЬЁ ПОЛУЧЕНО</button><div id="finalArea" class="hidden"></div>`);$("#reveal").onclick=()=>{let b=$("#reveal"),a=$("#finalArea");b.classList.add("hidden");a.classList.remove("hidden");a.innerHTML=`<div style="height:34px"></div><div class="kicker">MISSING HARDWARE DETECTED</div><div class="specgrid"><div class="spec"><small>BUILD VOLUME</small><strong>180³</strong></div><div class="spec"><small>MATERIAL</small><strong>PLA</strong></div><div class="spec"><small>STATUS</small><strong>READY</strong></div><div class="spec"><small>PACKAGE</small><strong>03</strong></div></div><div class="finalLogo">BAMBU LAB<br>A1 MINI</div><div class="finalSub">SAMSON INDUSTRIES IS NOW ONLINE.</div><div class="prize"><div class="num">FINAL PACKAGE</div><div class="open">03</div></div>`;confetti();beep(1040,.1);setTimeout(()=>beep(1320,.1),110);setTimeout(()=>beep(1560,.12),230)}}}
function confetti(){let c=$("#confetti");c.innerHTML="";for(let i=0;i<70;i++){let e=document.createElement("i");e.style.left=Math.random()*100+"vw";e.style.animationDuration=(2.4+Math.random()*2.8)+"s";e.style.animationDelay=(Math.random()*.5)+"s";e.style.setProperty("--drift",(Math.random()*220-110)+"px");e.style.opacity=.25+Math.random()*.7;c.appendChild(e)}setTimeout(()=>c.innerHTML="",6000)}render();})();
</script>
<!-- EASTER EGG: 19-1-13-19-15-14 = the beginning, not the end. -->
</body></html>
